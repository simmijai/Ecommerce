<!DOCTYPE html>
<html>
<head>
    <title>{% if form.instance.pk %}Edit{% else %}Add{% endif %} SubCategory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
<div class="container">
    <h1 class="mb-4">{% if form.instance.pk %}Edit{% else %}Add{% endif %} SubCategory</h1>

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Category</label>
            <select name="category" class="form-select" required>
                <option value="">-- Select Category --</option>
                {% for cat in form.fields.category.queryset %}
                    <option value="{{ cat.id }}" {% if form.instance.category == cat %}selected{% endif %}>{{ cat.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-control" placeholder="SubCategory Name"
                   value="{{ form.instance.name|default:'' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Slug</label>
            <input type="text" name="slug" class="form-control" placeholder="subcategory-slug"
                   value="{{ form.instance.slug|default:'' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" placeholder="Description">{{ form.instance.description|default:'' }}</textarea>
        </div>

        <button type="submit" class="btn btn-success">{% if form.instance.pk %}Update{% else %}Add{% endif %}</button>
        <a href="{% url 'subcategory_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
