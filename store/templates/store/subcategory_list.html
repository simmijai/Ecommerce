<!DOCTYPE html>
<html>
<head>
    <title>SubCategory List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
<div class="container">
    <h1 class="mb-4">SubCategories</h1>
    <a href="{% url 'subcategory_add' %}" class="btn btn-success mb-3">+ Add SubCategory</a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Category</th>
                <th>Name</th>
                <th>Slug</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for sub in subcategories %}
            <tr>
                <td>{{ sub.id }}</td>
                <td>{{ sub.category.name }}</td>
                <td>{{ sub.name }}</td>
                <td>{{ sub.slug }}</td>
                <td>{{ sub.description|default:"-" }}</td>
                <td>
                    <a href="{% url 'subcategory_edit' sub.id %}" class="btn btn-primary btn-sm">Edit</a>
                    <a href="{% url 'subcategory_delete' sub.id %}" class="btn btn-danger btn-sm"
                       onclick="return confirm('Are you sure to delete?');">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="6" class="text-center">No subcategories found.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
