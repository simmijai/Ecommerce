{% extends "dashboard/base.html" %}

{% block title %}{% if category %}Edit{% else %}Add{% endif %} Category{% endblock %}

{% block content %}
<div class="container-fluid p-4">
    <h2 class="mb-4">{% if category %}Edit{% else %}Add{% endif %} Category</h2>

    <form method="post" class="bg-white p-4 rounded shadow-sm">
        {% csrf_token %}
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Name</label>
                <input type="text" name="name" class="form-control" placeholder="Category Name" value="{{ category.name|default_if_none:'' }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Slug</label>
                <input type="text" name="slug" class="form-control" placeholder="category-slug" value="{{ category.slug|default_if_none:'' }}" required>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" placeholder="Description">{{ category.description|default_if_none:'' }}</textarea>
        </div>

        <div class="mt-3">
            <button type="submit" class="btn btn-success">{% if category %}Update{% else %}Add{% endif %} Category</button>
            <a href="{% url 'category_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
