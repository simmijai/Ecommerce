<!DOCTYPE html>
<html>
<head>
    <title>{% if category %}Edit{% else %}Add{% endif %} Category</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
<div class="container">
    <h1 class="mb-4">{% if category %}Edit{% else %}Add{% endif %} Category</h1>

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-control" placeholder="Category Name" value="{{ category.name|default:'' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Slug</label>
            <input type="text" name="slug" class="form-control" placeholder="category-slug" value="{{ category.slug|default:'' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" placeholder="Description">{{ category.description|default:'' }}</textarea>
        </div>
        <button type="submit" class="btn btn-success">{% if category %}Update{% else %}Add{% endif %}</button>
        <a href="{% url 'category_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
