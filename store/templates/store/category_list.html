<!DOCTYPE html>
<html>
<head>
    <title>Category List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
<div class="container">
    <h1 class="mb-4">Categories</h1>
    <a href="{% url 'category_add' %}" class="btn btn-success mb-3">+ Add Category</a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Slug</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for cat in categories %}
            <tr>
                <td>{{ cat.id }}</td>
                <td>{{ cat.name }}</td>
                <td>{{ cat.slug }}</td>
                <td>{{ cat.description|default:"-" }}</td>
                <td>
                    <a href="{% url 'category_edit' cat.id %}" class="btn btn-primary btn-sm">Edit</a>
                    <a href="{% url 'category_delete' cat.id %}" class="btn btn-danger btn-sm"
                       onclick="return confirm('Are you sure to delete?');">Delete</a>
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="5" class="text-center">No categories found.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
