<!-- templates/accounts/register.html -->
{% extends "base.html" %}

{% block content %}
<h2>User Registration</h2>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Register</button>
</form>
<p>Already have an account? <a href="{% url 'accounts:login' %}">Login here</a></p>
{% endblock %}
