<!-- dashboard/templates/dashboard/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin Dashboard{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { display: flex; min-height: 100vh; margin: 0; }
    .sidebar { min-width: 220px; max-width: 220px; background: #343a40; color: #fff; transition: all 0.3s; }
    .sidebar h4 { text-align: center; padding: 15px; margin: 0; background: #212529; }
    .sidebar .nav-link { color: #adb5bd; padding: 10px 15px; display: block; }
    .sidebar .nav-link.active, .sidebar .nav-link:hover { color: #fff; background: #495057; border-radius: 5px; }
    .content { flex-grow: 1; background: #f8f9fa; padding: 20px; }
    @media (max-width: 768px) { .sidebar { position: fixed; left: -220px; top: 0; height: 100%; z-index: 1000; } .sidebar.active { left: 0; } .content { margin-left: 0; } }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar d-flex flex-column">
    <h4>Admin Panel</h4>
    <nav class="nav flex-column">
      <a href="{% url 'dashboard:index' %}" class="nav-link {% if request.path == '/' %}active{% endif %}">Dashboard</a>
      <a href="{% url 'store:product_list' %}" class="nav-link {% if 'product' in request.path %}active{% endif %}">Products</a>
      <a href="{% url 'store:category_list' %}" class="nav-link {% if 'category' in request.path %}active{% endif %}">Categories</a>
      <a href="{% url 'store:subcategory_list' %}" class="nav-link {% if 'subcategory' in request.path %}active{% endif %}">Subcategories</a>
      <a href="#" class="nav-link">Orders</a>
      <a href="#" class="nav-link">Settings</a>
      <a href="{% url 'accounts:logout' %}" class="nav-link">Logout</a>
    </nav>
  </div>

  <!-- Content -->
  <div class="content w-100">
    <button class="btn btn-dark d-md-none mb-3" id="toggleSidebar">☰ Menu</button>
    {% block content %}
    <!-- Each page content will go here -->
    <h1>Welcome, Admin! Here’s the overview of your e-commerce site.
</h1>
    {% endblock %}
  </div>

  <script>
    const toggleSidebar = document.getElementById("toggleSidebar");
    const sidebar = document.querySelector(".sidebar");
    toggleSidebar.addEventListener("click", () => { sidebar.classList.toggle("active"); });
  </script>

</body>
</html>
